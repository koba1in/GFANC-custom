[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfanc-custom"
version = "0.1.0"
description = "Generative fixed-filter active noise control research code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy==1.26.4",
    "pandas",
    "progressbar33==2.4",
    "scikit-learn",
    "scipy",
    "soundfile",
    "torch==2.0.1",
    "torchaudio==2.0.2",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel==7.2.0",
    "jupyterlab",
]
experiments = [
    "librosa",
    "pyroomacoustics",
]
all = [
    "ipykernel",
    "jupyterlab",
    "librosa",
    "pyroomacoustics",
]

[tool.setuptools.packages.find]
where = ["src"]
